name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub'ın ubuntu sunucularında Android SDK hazır kurulu (ANDROID_HOME).
      - name: Android SDK kontrol
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Kişisel veri taraması
        run: |
          if git ls-files | grep -iE '\.log$|btsnoop|bugreport'; then echo "Kayıt dosyası depoda olmamalı"; exit 1; fi
          if git grep -nIE '([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}' -- . ':!*.md'; then echo "Tam MAC adresi bulundu"; exit 1; fi

      # Sabit imza: test anahtarı derlemeler arasında önbellekte tutulur, böylece yeni sürüm eskisinin üzerine kurulur.
      - name: İmza anahtarını geri yükle
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ls05-debug-keystore-v1

      - name: Protokol testleri
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :protocol:test

      - name: APK derle (debug)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: İmza parmak izi
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E 'SHA256' | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: LS05Controller-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-raporu
          path: protocol/build/reports/tests/

      - name: Telefondan indirmek için Release yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LS05Controller-debug.apk
          gh release create "build-${{ github.run_number }}" LS05Controller-debug.apk \
            --title "LS05 Controller test derlemesi ${{ github.run_number }}" \
            --notes "Otomatik debug derlemesi, commit ${{ github.sha }}. Kurulum ve gate testi için README'ye bak." \
            --prerelease
